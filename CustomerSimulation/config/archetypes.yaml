# ---------------------------------------------------------------------------
# Archetype configuration for CustomerSimulation
#
# To add a new archetype: add a block under `archetypes:` with the same
# structure and add its name + weight to `mixture_prior`.
# All probabilities must be >= 0. Stage transition weights are normalised
# automatically so they do not need to sum to exactly 1.0.
# ---------------------------------------------------------------------------

mixture_prior:
  Explorer: 0.30
  FastBuyer: 0.20
  DetailedComparator: 0.20
  DiscountHunter: 0.15
  WindowShopper: 0.15

archetypes:

  Explorer:
    # Probability of transitioning to each next decision_point (or "done").
    # Weights are normalised at runtime — they do not need to sum to 1.
    stage_transitions:
      landing:
        pdp: 0.70
        scroll_engagement: 0.10
        done: 0.20
      scroll_engagement:
        pdp: 0.70
        done: 0.30
      pdp:
        pdp: 0.45
        cart: 0.12
        scroll_engagement: 0.10
        done: 0.33
      cart:
        checkout: 0.38
        pdp: 0.30
        done: 0.32
      checkout:
        done: 1.00

    # Base event probabilities at each decision_point when action is no-op.
    # Events are sampled independently (Bernoulli per event type).
    base_events:
      landing:
        exit_intent: 0.12
        scroll_depth: 0.10
        dwell_time: 0.15
      scroll_engagement:
        scroll_depth: 0.30
        dwell_time: 0.20
        exit_intent: 0.10
      pdp:
        add_to_cart: 0.06
        exit_intent: 0.18
        scroll_depth: 0.15
        dwell_time: 0.25
      cart:
        exit_intent: 0.15
      checkout:
        checkout_submit: 0.40
        purchase: 0.35
        exit_intent: 0.22

    # Widget interaction probabilities when the specified action is served.
    # Exactly one of widget_click or widget_dismiss fires (or neither).
    widget_events:
      trending_carousel:
        widget_click: 0.25
        widget_dismiss: 0.10
      discount_banner:
        widget_click: 0.05
        widget_dismiss: 0.15
      frequently_bought_together:
        widget_click: 0.22
        widget_dismiss: 0.08
      trust_badge:
        widget_click: 0.10
        widget_dismiss: 0.05
      help_popup:
        widget_click: 0.08
        widget_dismiss: 0.10

    # Additive lift applied to base_events when a specific action is served.
    # Negative values reduce the probability (e.g. help_popup lowers exit_intent).
    action_event_lifts:
      discount_banner:
        add_to_cart: 0.02
        checkout_submit: 0.03
      frequently_bought_together:
        add_to_cart: 0.06
      trust_badge:
        checkout_submit: 0.04
      help_popup:
        exit_intent: -0.04

    # Mechanism 3 (action-dependent transitions): additive lift on the
    # next-stage sampling weights when this action is served.  Inert unless the
    # global `dynamics.transition_coupling_strength` knob is > 0.  Lifts target
    # next-stage keys present in stage_transitions for the current point.
    action_stage_lifts:
      frequently_bought_together: { cart: 0.50, done: -0.20 }
      discount_banner:            { cart: 0.30, checkout: 0.30, done: -0.20 }
      trust_badge:                { checkout: 0.40, done: -0.15 }
      help_popup:                 { pdp: 0.20, done: -0.30 }
      trending_carousel:          { pdp: 0.30, done: -0.10 }

    # Uniform range for order total when a purchase event fires.
    order_total_range: [30, 120]

