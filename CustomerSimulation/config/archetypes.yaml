# ---------------------------------------------------------------------------
behavior_policy:
  # Global epsilon for the uniform-random behavior policy.
  # Per-archetype overrides are supported; all others use the global value.
  epsilon: 0.2
  per_archetype_epsilon:
    WindowShopper: 0.35

# ---------------------------------------------------------------------------
# Sequential-dynamics knobs (V3_sequential_environment_plan.md §4).
# EVERY knob defaults to off so the baseline reproduces today's near-tie (H0).
# When off, a knob must add no behaviour and consume no extra RNG draws, so
# legacy runs stay byte-for-byte reproducible.  The sweep driver overrides
# these per grid point.
dynamics:
  # Mechanism 1 — intervention fatigue (cumulative over-exposure suppresses response)
  fatigue_rate: 0.0          # 0 = off; widget response scales by exp(-rate * k)
  fatigue_window: 0          # 0 = cumulative k; N = exponential window of last ~N steps
  p_dismiss_max: 0.6         # dismiss probability rises toward this ceiling as response decays

  # Mechanism 2 — delayed / assist reward (credit assignment across steps)
  delayed_reward_strength: 0.0   # 0 = off; purchase prob at cash-out += strength * primed_credit
  delayed_reward_decay: 0.9      # per-step decay of latent primed credit, in (0, 1]
  priming_actions: [help_popup, trust_badge]   # actions that accrue assist credit when served
  priming_amount: 1.0            # credit accrued per priming action served
  cash_out_point: checkout       # decision point where accrued credit lifts purchase probability

  # Mechanism 3 — action-dependent transitions (actions steer the funnel)
  transition_coupling_strength: 0.0  # 0 = off → identical to action-independent transitions

  # Robustness check (§7): also expose interventions_shown_bucket to the bandit.
  # Implemented via the SEQUENTIAL_EXPOSE_HISTORY_TO_BANDIT env var read in
  # shared_schema.features; this flag is documentary (the sweep sets the env var).
  expose_history_to_bandit: false

# ---------------------------------------------------------------------------
simulation:
  # Unified with the eval scripts' default --t-max (was 30; the eval scripts
  # default 20).  Treated as a sweep axis by the sequentiality experiment.
  t_max: 20
