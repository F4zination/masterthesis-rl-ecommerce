# Compose override for /path/to/MaglioSite/docker-compose.yml.
# STUDY_REPO_PATH must be the absolute path of this study repository on the VPS.

services:
  web:
    # Keep the original default network and also expose the stable `web` alias
    # on the shared network. This avoids depending on implicit Compose aliases
    # when the existing site was previously launched under another project.
    networks:
      default:
      study_gateway:
        aliases: [web]

  nginx:
    environment:
      APEX_DOMAIN: "${APEX_DOMAIN:-thedemoshop.live}"
      DISPATCHER_DOMAIN: "${DISPATCHER_DOMAIN:-start.thedemoshop.live}"
      V2_DOMAIN: "${V2_DOMAIN:-v2.thedemoshop.live}"
      V3_DOMAIN: "${V3_DOMAIN:-v3.thedemoshop.live}"
      STUDY_CERTIFICATE_NAME: "${STUDY_CERTIFICATE_NAME:-thedemoshop.live}"
    volumes:
      - ${STUDY_REPO_PATH:?Set STUDY_REPO_PATH to the absolute study repository path}/deploy/shared-gateway/study.conf.template:/etc/nginx/templates/study.conf.template:ro
      - ${STUDY_REPO_PATH:?Set STUDY_REPO_PATH to the absolute study repository path}/deploy/certbot/conf:/etc/letsencrypt:ro
      - ${STUDY_REPO_PATH:?Set STUDY_REPO_PATH to the absolute study repository path}/deploy/certbot/www:/var/www/certbot:ro
    networks:
      default:
      study_gateway:
    # Pick up renewed certificates without interrupting either website.
    command:
      - /bin/sh
      - -c
      - |
        /docker-entrypoint.d/20-envsubst-on-templates.sh
        nginx -t
        ( while :; do sleep 6h & wait $${!}; nginx -s reload; done ) &
        exec nginx -g 'daemon off;'

networks:
  study_gateway:
    name: study-gateway
    external: true
